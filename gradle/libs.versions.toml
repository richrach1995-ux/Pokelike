#
# Zentraler Version Catalog.
#
# Saemtliche Abhaengigkeiten und Plugin-Versionen werden ausschliesslich hier
# gepflegt. Kein Modul darf Versionen hart im build.gradle.kts notieren.
# Das haelt Upgrades an genau einer Stelle und verhindert, dass zwei Module
# unbemerkt auf verschiedenen Versionen derselben Bibliothek laufen.
#

[versions]

# --- Build Toolchain ------------------------------------------------------
agp = "8.7.3"
kotlin = "2.0.21"
ksp = "2.0.21-1.0.28"
javaTarget = "17"

# --- Android SDK Level ----------------------------------------------------
compileSdk = "35"
targetSdk = "35"
minSdk = "24"

# --- AndroidX Basis -------------------------------------------------------
coreKtx = "1.15.0"
appcompat = "1.7.0"
activityCompose = "1.9.3"
lifecycle = "2.8.7"
splashscreen = "1.0.1"

# --- Compose --------------------------------------------------------------
# Die BOM steuert alle androidx.compose.* Artefakte. Deshalb stehen deren
# Einzelversionen bewusst NICHT in diesem Katalog.
composeBom = "2024.12.01"
navigationCompose = "2.8.5"

# --- Dependency Injection -------------------------------------------------
hilt = "2.52"
hiltNavigationCompose = "1.2.0"

# --- Persistenz -----------------------------------------------------------
room = "2.6.1"
datastore = "1.1.1"

# --- Nebenlaeufigkeit -----------------------------------------------------
coroutines = "1.9.0"

# --- Serialisierung -------------------------------------------------------
# Wird ab dem Persistenz-Schritt fuer Savegames und Remote-Config-Payloads
# gebraucht; das Plugin wird bereits jetzt registriert, damit spaetere
# Schritte keine Toolchain-Aenderung mehr benoetigen.
kotlinxSerialization = "1.7.3"

# --- Desugaring -----------------------------------------------------------
# Stellt java.time & Co. auch unterhalb von API 26 bereit.
desugarJdkLibs = "2.1.3"

# --- Test -----------------------------------------------------------------
junit = "4.13.2"
androidxTestExt = "1.2.1"
espresso = "3.6.1"
truth = "1.4.4"
turbine = "1.2.0"


[libraries]

# --- AndroidX Basis -------------------------------------------------------
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "splashscreen" }

# --- Lifecycle ------------------------------------------------------------
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycle" }

# --- Compose (Versionen kommen aus der BOM) -------------------------------
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

# --- Dependency Injection -------------------------------------------------
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

# --- Persistenz -----------------------------------------------------------
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }
datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# --- Nebenlaeufigkeit -----------------------------------------------------
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

# --- Serialisierung -------------------------------------------------------
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

# --- Desugaring -----------------------------------------------------------
desugarJdkLibs = { group = "com.android.tools", name = "desugar_jdk_libs", version.ref = "desugarJdkLibs" }

# --- Test -----------------------------------------------------------------
junit = { group = "junit", name = "junit", version.ref = "junit" }
kotlin-test = { group = "org.jetbrains.kotlin", name = "kotlin-test", version.ref = "kotlin" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExt" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
truth = { group = "com.google.truth", name = "truth", version.ref = "truth" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }


[plugins]

android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }

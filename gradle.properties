# Gradle JVM-Einstellungen.
# 4 GB Heap, weil KSP (Room + Hilt) bei wachsender Codebasis sonst in den
# GC-Thrash laeuft. UTF-8 erzwingen, damit Umlaute in Ressourcen und
# Kommentaren plattformunabhaengig identisch verarbeitet werden.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

# Nur die Module bauen, die sich tatsaechlich geaendert haben.
org.gradle.parallel=true
org.gradle.caching=true

# Configuration Cache ist bewusst aus. Hilt und KSP sind damit grundsaetzlich
# kompatibel, aber die Kombination muss einmal auf der Zielmaschine verifiziert
# werden. Nach einem erfolgreichen `./gradlew assembleDebug --configuration-cache`
# kann der Wert auf true gesetzt werden.
org.gradle.configuration-cache=false

# AndroidX ist Pflicht (Support Library wird nicht mehr unterstuetzt).
android.useAndroidX=true

# Nicht-transitive R-Klassen: jedes Modul sieht nur seine eigenen Ressourcen.
# Verkleinert die R-Klassen deutlich und beschleunigt inkrementelle Builds.
android.nonTransitiveRClass=true

# Kotlin-Compiler im eigenen Daemon-Prozess (stabilere inkrementelle Builds).
kotlin.code.style=official

# Hinweis: Ab AGP 8 sind BuildConfig, AIDL, RenderScript und Shader
# standardmaessig deaktiviert. Ein Modul, das eines davon braucht, schaltet es
# explizit in seiner buildFeatures-Sektion ein - projektweite Defaults dafuer
# sind nicht mehr noetig.

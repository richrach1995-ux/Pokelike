name: Start-Test

# Startet die gebaute App auf einem echten Emulator und schreibt den Absturz-
# Stacktrace direkt ins Job-Protokoll. Ohne diesen Schritt lässt sich ein
# Startabsturz nur raten.
on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

jobs:
  smoke:
    name: App starten (API ${{ matrix.api }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api: [30, 34, 35]

    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4

      - name: Debug-APK bauen
        run: ./gradlew :app:assembleDebug

      - name: KVM freischalten
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Auf Emulator starten
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          # Achtung: Der Runner führt jede Zeile in einer eigenen Shell aus.
          # Der komplette Ablauf steht deshalb in tools/smoke.sh.
          script: bash tools/smoke.sh
